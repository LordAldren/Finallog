<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLATE | Initializing Logistics Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Roboto+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #00e1ff;
            --accent: #0072ff;
            --bg-dark: #020617;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(0, 225, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Outfit', sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Layer */
        .nexus-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(2, 6, 23, 0.8), rgba(2, 6, 23, 0.6)),
                url('assets/images/loading_bg.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
            filter: scale(1.1);
            animation: bgShift 20s infinite alternate ease-in-out;
        }

        @keyframes bgShift {
            0% {
                transform: scale(1) translate(0, 0);
            }

            100% {
                transform: scale(1.1) translate(-20px, -20px);
            }
        }

        /* Glass Container */
        .loader-card {
            width: 450px;
            padding: 3rem;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 225, 255, 0.1);
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        /* Decorative Corners */
        .loader-card::before,
        .loader-card::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--primary);
        }

        .loader-card::before {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
            border-radius: 12px 0 0 0;
        }

        .loader-card::after {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
            border-radius: 0 0 12px 0;
        }

        .logo-container {
            margin-bottom: 2rem;
            position: relative;
        }

        .logo-container img {
            width: 100px;
            filter: drop-shadow(0 0 15px rgba(0, 225, 255, 0.4));
            animation: logoPulse 2s infinite ease-in-out;
        }

        @keyframes logoPulse {

            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px rgba(0, 225, 255, 0.4));
            }

            50% {
                transform: scale(1.05);
                filter: drop-shadow(0 0 25px rgba(0, 225, 255, 0.7));
            }
        }

        .system-status {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.8rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1.5rem;
            height: 20px;
            opacity: 0.8;
        }

        /* Progress Section */
        .progress-wrapper {
            margin-bottom: 1rem;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.5rem;
        }

        .progress-bar-bg {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--primary));
            box-shadow: 0 0 15px var(--primary);
            transition: width 0.3s ease-out;
        }

        .initializing-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        /* Scanning Line overlay for the whole page */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.03) 50%,
                    rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 20;
            pointer-events: none;
            opacity: 0.2;
        }

        .data-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="nexus-bg"></div>
    <div class="scanline"></div>
    <div class="data-particles" id="particles"></div>

    <div class="loader-card">
        <div class="logo-container">
            <img src="assets/images/logo.png" alt="SLATE LOGO">
        </div>

        <div class="system-status" id="status-text">SYSTEM INITIALIZING...</div>

        <div class="progress-wrapper">
            <div class="progress-label">
                <span>Network Integrity</span>
                <span id="percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-fill" id="bar"></div>
            </div>
        </div>

        <div class="initializing-text">SLATE v2.0 - Secure Freight Management</div>
    </div>

    <script>
        const statusText = document.getElementById('status-text');
        const percentText = document.getElementById('percent');
        const bar = document.getElementById('bar');

        const messages = [
            "Syncing Fleet Protocols...",
            "Encrypting Data Streams...",
            "Optimizing Route Matrix...",
            "Authenticating Sessions...",
            "Finalizing Nexus Link..."
        ];

        let progress = 0;
        let msgIndex = 0;

        const updateLoader = () => {
            if (progress >= 100) {
                progress = 100;
                percentText.textContent = "100%";
                bar.style.width = "100%";
                statusText.textContent = "ACCESS GRANTED";
                statusText.style.color = "#00ff9d";

                setTimeout(() => {
                    document.body.style.opacity = '0';
                    document.body.style.transition = 'opacity 0.8s ease';
                    setTimeout(() => {
                        window.location.href = '/code/auth/login.php';
                    }, 800);
                }, 1000);
                return;
            }

            progress += Math.random() * 5 + 1;
            if (progress > 100) progress = 100;

            percentText.textContent = Math.floor(progress) + "%";
            bar.style.width = progress + "%";

            // Update status text periodically
            if (Math.floor(progress) % 20 === 0 && msgIndex < messages.length - 1) {
                msgIndex = Math.min(Math.floor(progress / 20), messages.length - 1);
                statusText.textContent = messages[msgIndex];
            }

            setTimeout(updateLoader, Math.random() * 150 + 50);
        };

        // Create simple background particles
        const createParticles = () => {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.width = '2px';
                p.style.height = '2px';
                p.style.background = '#00e1ff';
                p.style.opacity = Math.random() * 0.5;
                p.style.top = Math.random() * 100 + '%';
                p.style.left = Math.random() * 100 + '%';
                p.style.borderRadius = '50%';

                p.animate([
                    { transform: 'translateY(0)', opacity: 0 },
                    { transform: 'translateY(-100px)', opacity: p.style.opacity },
                    { transform: 'translateY(-200px)', opacity: 0 }
                ], {
                    duration: Math.random() * 3000 + 2000,
                    iterations: Infinity,
                    delay: Math.random() * 2000
                });
                container.appendChild(p);
            }
        };

        window.onload = () => {
            createParticles();
            setTimeout(updateLoader, 500);
        };
    </script>
</body>

</html>
